run_as = "listener"

# The listener sees the libraries "Music" and "Extra", but not "Hidden". Amy has "Solo" in Music,
# whose songs were added out of order: S3 (disc 2, track 1), then S1 and S2 (disc 1, tracks 1 and
# 2). "Duo", in Extra, credits Amy, then Bob. Bob also has "Other" in Music. "Secret", in Hidden,
# credits Amy and Hal and holds H1. Zed is credited only on S1. The listener starred Amy, Hal,
# Solo, Secret, S2 and H1, rated Amy 4 and Solo 5, and played S1 twice.

