run_as = "listener"

# The listener and the neighbour see "Album": the short songs One to Five and the long Long. Hidden
# is in a library nobody is granted.

[[users]]
key = "listener"

[[users]]
key = "neighbour"

[[api_keys]]
key = "listener_key"
user = "listener"

[[api_keys]]
key = "neighbour_key"
user = "neighbour"

[[libraries]]
key = "music"
name = "Music"
users = ["listener", "neighbour"]

[[libraries]]
key = "locked"
name = "Locked"

[[releases]]
