run_as = "listener"

# The listener and the downloader, who may download, see "Album" and its songs Synced, Plain and
# Segment, a span of its file as a cue sheet's; "Secret" is in a library nobody is granted.

[[users]]
key = "listener"

[[users]]
key = "downloader"
permissions = ["download"]

[[api_keys]]
key = "listener_key"
user = "listener"

[[api_keys]]
key = "downloader_key"
user = "downloader"

[[libraries]]
key = "music"
name = "Music"
users = ["listener", "downloader"]

[[libraries]]
key = "locked"
name = "Locked"

[[artists]]
key = "amy"
name = "Amy"

[[releases]]
key = "album"
title = "Album"
library = "music"
artists = ["amy"]

[[artists]]
key = "bob"
name = "Bob"

[[releases]]
key = "secret"
title = "Secret"
library = "locked"

[[tracks]]
key = "synced"
title = "Synced"
release = "album"
duration_ms = 180000
artists = ["amy"]
file = "song.opus"

[[tracks]]
key = "plain"
title = "Plain"
release = "album"
duration_ms = 180000
artists = ["amy"]
file = "song.opus"

[[tracks]]
key = "segment"
title = "Segment"
release = "album"
artists = ["amy"]
file = "song.opus"
start_ms = 100
end_ms = 400

[[tracks]]
key = "hidden"
title = "Hidden"
release = "secret"
file = "song.opus"

# Plain also has fetched lyrics in French and English; the listener's own English ones outrank the
# fetched English ones.

[[lyrics]]
track = "plain"
provider = "lrclib"
language = "fra"
body = "Un\nDeux"

[[lyrics]]
track = "plain"
provider = "other"
language = "eng"
body = "Uno"

# Fileless has no file to stream.

[[tracks]]
key = "fileless"
title = "Fileless"
release = "album"
artists = ["amy"]

# Amy is only Home's composer and Away's album artist; Bob performs both, with Amy on Duet.

[[tracks]]
key = "home"
title = "Home"
release = "album"
artists = ["bob"]
credits = [{ artist = "amy", type = "composer" }]

[[tracks]]
key = "away"
title = "Away"
release = "album"
artists = ["bob"]

[[tracks]]
key = "duet"
title = "Duet"
release = "album"
artists = ["bob", "amy"]

[[lyrics]]
track = "home"
body = "Home lyrics"

[[lyrics]]
track = "away"
body = "Away lyrics"

[[lyrics]]
track = "duet"
body = "Duet lyrics"

# Björk performs Jóga, matched whatever the case of its accented letters.

[[artists]]
key = "bjork"
name = "Björk"

[[tracks]]
key = "joga"
title = "Jóga"
release = "album"
artists = ["bjork"]

[[lyrics]]
track = "joga"
body = "Jóga lyrics"

