run_as = "listener"

# The listener sees the libraries "Music" and "Extra", but not "Hidden". Amy (with a cover) has
# "Solo" (with a cover) in Music and "Duo" in Extra; "Secret", in Hidden, credits Amy and Hal.
# Bob has "Bobs" in Extra, whose track also credits Zed; Émile and 2Pac each have an album in
# Music, as do the Zebras, sorted as "Zebras, The". The listener starred Amy. Bob has a biography
# and a MusicBrainz id, Émile only a biography, 2Pac only a MusicBrainz id, and Zed only an id of
# a scheme the plugin doesn't read.

[[users]]
key = "listener"

[[api_keys]]
key = "listener_key"
user = "listener"

[[libraries]]
key = "music"
name = "Music"
users = ["listener"]

[[libraries]]
key = "extra"
name = "Extra"
users = ["listener"]

[[libraries]]
key = "hidden"
name = "Hidden"

[[artists]]
key = "amy"
name = "Amy"
cover = "cover.png"

[[artists]]
key = "bob"
name = "bob"
description = "Bob's story."
identifiers = { "musicbrainz:artist" = "0b0b0b0b-0000-4000-8000-000000000001" }

[[artists]]
key = "emile"
name = "Émile"
description = "Émile's story."

[[artists]]
key = "pac"
name = "2Pac"
identifiers = { "musicbrainz:artist" = "2bac2bac-0000-4000-8000-000000000002" }

[[artists]]
key = "zebras"
name = "The Zebras"
sort_name = "Zebras, The"

[[artists]]
key = "zed"
name = "Zed"
identifiers = { "example:artist" = "zed-1" }

[[artists]]
key = "hal"
name = "Hal"

[[releases]]
key = "solo"
title = "Solo"
library = "music"
artists = ["amy"]
cover = "cover.png"

[[releases]]
key = "duo"
title = "Duo"
library = "extra"
artists = ["amy"]

[[releases]]
key = "secret"
title = "Secret"
library = "hidden"
artists = ["amy", "hal"]

[[releases]]
key = "bobs"
title = "Bobs"
library = "extra"
artists = ["bob"]

[[releases]]
key = "emiles"
title = "Emiles"
library = "music"
artists = ["emile"]

[[releases]]
key = "pacs"
title = "Pacs"
library = "music"
artists = ["pac"]

[[releases]]
key = "stripes"
title = "Stripes"
library = "music"
artists = ["zebras"]

[[tracks]]
key = "z1"
title = "Z1"
release = "stripes"
artists = ["zebras"]

[[tracks]]
key = "s1"
title = "S1"
release = "solo"
artists = ["amy"]

[[tracks]]
key = "d1"
title = "D1"
release = "duo"
artists = ["amy"]

[[tracks]]
key = "h1"
title = "H1"
release = "secret"
artists = ["amy", "hal"]

[[tracks]]
key = "b1"
title = "B1"
release = "bobs"
artists = ["bob", "zed"]

[[tracks]]
key = "e1"
title = "E1"
release = "emiles"
artists = ["emile"]

[[tracks]]
key = "p1"
title = "P1"
release = "pacs"
artists = ["pac"]

[[favorites]]
user = "listener"
target = "amy"
at = 1700000000000
