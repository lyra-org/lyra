run_as = "listener"

# The listener and the friend see "Amy Album" (Amy) holding A1 to A4, "Namesake" (another Amy)
# holding N1, and "Bob Album" (Bob) holding B1. "Secret" (Amy, Hal), in a library nobody is
# granted, holds H1. The listener played A1 three times, N1 twice, A2 and A3 once each (A2 last),
# B1 once and H1 four times; the friend played A4 five times.

