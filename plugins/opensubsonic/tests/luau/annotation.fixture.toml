run_as = "listener"

# The listener and the neighbour see the libraries "Music" and "Extra": "Solo" (Amy) in Music holds
# S1, S2 and S3, whose duration is unknown, and "Far" (Bob) in Extra holds F1. "Secret", in a library nobody is granted, holds
# H1. The listener starred F1 long ago.

