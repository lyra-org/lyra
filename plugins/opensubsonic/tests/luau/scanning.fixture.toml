run_as = "admin"

# The listener and the manager see "Music"; "Locked" is granted to no one.

[[users]]
key = "listener"

[[users]]
key = "manager"
permissions = ["manage_libraries"]

[[users]]
key = "admin"
admin = true

[[api_keys]]
key = "listener_key"
user = "listener"

[[api_keys]]
key = "manager_key"
user = "manager"

[[api_keys]]
key = "admin_key"
user = "admin"

[[libraries]]
key = "music"
name = "Music"
users = ["listener", "manager"]

[[libraries]]
key = "locked"
name = "Locked"

[[releases]]
key = "album"
title = "Album"
library = "music"
