run_as = "admin"

# The listener sees "Music", the downloader "Music" and "Extra"; "Locked" is granted to no one, and the
# lonely user sees no library.

[[users]]
key = "listener"

[[users]]
key = "downloader"
permissions = ["download"]

[[users]]
key = "admin"
admin = true

[[users]]
key = "deputy"
admin = true

[[users]]
key = "lonely"

[[api_keys]]
key = "lonely_key"
user = "lonely"

[[api_keys]]
key = "listener_key"
user = "listener"

[[api_keys]]
key = "downloader_key"
user = "downloader"

[[api_keys]]
key = "admin_key"
user = "admin"

[[libraries]]
key = "music"
name = "Music"
users = ["listener", "downloader"]

[[libraries]]
key = "extra"
name = "Extra"
users = ["downloader"]

[[libraries]]
key = "locked"
name = "Locked"
