run_as = "listener"

# The listener is granted "Open", whose "Solo" holds S1 and S2, and not "Closed", whose "Hidden"
# holds H1. The listener's "Mix" holds S1.

[[users]]
key = "listener"

[[api_keys]]
key = "listener_key"
user = "listener"

[[libraries]]
key = "open"
name = "Open"
users = ["listener"]

[[libraries]]
key = "closed"
name = "Closed"

[[releases]]
key = "solo"
title = "Solo"
library = "open"

[[releases]]
key = "hidden"
title = "Hidden"
library = "closed"

[[tracks]]
key = "s1"
title = "S1"
release = "solo"

[[tracks]]
key = "s2"
title = "S2"
release = "solo"

[[tracks]]
key = "h1"
title = "H1"
release = "hidden"

[[playlists]]
key = "mix"
owner = "listener"
name = "Mix"
tracks = ["s1"]
