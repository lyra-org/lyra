run_as = "listener"

# The listener sees Song, which has a provider's synced lyrics and thin-timed shared ones.

[[users]]
key = "listener"

[[api_keys]]
key = "phone"
user = "listener"

[[libraries]]
key = "music"
name = "Music"
users = ["listener"]

[[releases]]
key = "album"
title = "Album"
library = "music"

[[tracks]]
key = "song"
title = "Song"
release = "album"
duration_ms = 180000

[[tracks]]
key = "bare"
title = "Bare"
release = "album"
duration_ms = 180000

[[lyrics]]
track = "song"
provider = "lrclib"
language = "eng"
content_type = "application/lrc"
body = "[00:01.00]One\n[02:00.00]Two"
