run_as = "admin"

# The listener's library holds "Open" (Open 1, Open 2); nobody but admins sees "Vault".

[[users]]
key = "admin"
admin = true

[[users]]
key = "listener"

[[api_keys]]
key = "admin_key"
user = "admin"

[[api_keys]]
key = "listener_key"
user = "listener"

[[connections]]
key = "speaker"
user = "listener"
commands = ["pause", "play_tracks"]

[[connections]]
key = "knob"
user = "listener"
commands = ["pause"]

[[libraries]]
key = "music"
name = "Music"
users = ["listener"]

[[libraries]]
key = "vault"
name = "Vault"

[[releases]]
key = "open"
title = "Open"
library = "music"

[[releases]]
key = "hidden"
title = "Vault"
library = "vault"

[[tracks]]
key = "open2"
title = "Open 2"
release = "open"
disc = 1
track = 2

[[tracks]]
key = "open1"
title = "Open 1"
release = "open"
disc = 1
track = 1

[[tracks]]
key = "hidden1"
title = "Hidden 1"
release = "hidden"
disc = 1
track = 1
