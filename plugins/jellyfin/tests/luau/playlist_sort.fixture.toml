run_as = "listener"

# The listener owns "Alpha" (300 s), "Beta" (100 s), "Epsilon" (100 s) and "Gamma" (200 s).

[[users]]
key = "listener"

[[libraries]]
key = "music"
name = "Music"
users = ["listener"]

[[releases]]
key = "album"
title = "Album"
library = "music"

[[tracks]]
key = "short"
title = "Short"
release = "album"
duration_ms = 100000

[[tracks]]
key = "medium"
title = "Medium"
release = "album"
duration_ms = 200000

[[tracks]]
key = "long"
title = "Long"
release = "album"
duration_ms = 300000

[[playlists]]
key = "alpha"
owner = "listener"
name = "Alpha"
tracks = ["long"]

[[playlists]]
key = "beta"
owner = "listener"
name = "Beta"
tracks = ["short"]

[[playlists]]
key = "epsilon"
owner = "listener"
name = "Epsilon"
tracks = ["short"]

[[playlists]]
key = "gamma"
owner = "listener"
name = "Gamma"
tracks = ["medium"]
