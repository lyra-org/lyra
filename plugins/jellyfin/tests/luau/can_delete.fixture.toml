run_as = "listener"

# The listener owns "Mine" and sees the owner's public "Shared". "Album" by Amy, in Rock, holds
# Song.

[[users]]
key = "owner"

[[users]]
key = "listener"

[[api_keys]]
key = "phone"
user = "listener"

[[libraries]]
key = "music"
name = "Music"
users = ["listener"]

[[artists]]
key = "amy"
name = "Amy"

[[genres]]
key = "rock"
name = "Rock"

[[releases]]
key = "album"
title = "Album"
library = "music"
artists = ["amy"]
genres = ["rock"]

[[tracks]]
key = "song"
title = "Song"
release = "album"
artists = ["amy"]

[[playlists]]
key = "mine"
owner = "listener"
name = "Mine"
tracks = ["song"]

[[playlists]]
key = "shared"
owner = "owner"
name = "Shared"
public = true
