run_as = "admin"

# "Mixed" holds Playing and Missing, whose file a sync no longer found; "Lost" holds only Gone,
# missing too. The admin bookmarked Missing and owns "Mine" (Missing, Playing).

[[users]]
key = "admin"
admin = true

[[libraries]]
key = "music"
name = "Music"

[[artists]]
key = "amy"
name = "Amy"

[[releases]]
key = "mixed"
title = "Mixed"
library = "music"
artists = ["amy"]

[[releases]]
key = "lost"
title = "Lost"
library = "music"
artists = ["amy"]

[[tracks]]
key = "playing"
title = "Playing"
release = "mixed"
track = 1
artists = ["amy"]
file = "song.opus"

[[tracks]]
key = "missing"
title = "Missing"
release = "mixed"
track = 2
artists = ["amy"]
file = "song.opus"
missing = true

[[tracks]]
key = "gone"
title = "Gone"
release = "lost"
artists = ["amy"]
file = "song.opus"
missing = true

[[playlists]]
key = "mine"
owner = "admin"
name = "Mine"
public = false
tracks = ["missing", "playing"]
