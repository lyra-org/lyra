run_as = "listener"

# The listener is granted "Music", whose "Album" holds Song, Saved and Untimed, and not "Closed",
# whose "Hidden" holds Secret. The listener has played Song once and bookmarked Saved.

[[users]]
key = "listener"

[[api_keys]]
key = "phone"
user = "listener"

[[libraries]]
