run_as = "listener"

# The listener and the other user are granted "Music", whose "Album" by Amy holds Song, and the
# listener owns the playlist "Mix". "Music" also holds the releases "Bulk 01" to "Bulk 26", each
# with the one track "Bulk track 01" to "Bulk track 26". The listener is not granted "Closed",
# whose "Hidden" holds Secret, a favorite of the listener's from before.

[[users]]
key = "listener"

[[users]]
key = "other"

[[api_keys]]
key = "phone"
user = "listener"

[[api_keys]]
key = "tablet"
user = "other"

[[libraries]]
key = "music"
name = "Music"
users = ["listener", "other"]

[[libraries]]
key = "closed"
name = "Closed"

[[artists]]
