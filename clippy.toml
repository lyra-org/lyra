# Luau API calls that can raise an error, which longjmps over Rust frames or aborts. Only
# harmony-luau's gateway (harmony-luau/src/runtime/gateway.rs) calls them, under a protected call.
disallowed-methods = [
	{ path = "harmony_luau_sys::vm::lua_newthread", reason = "can raise; use the harmony-luau gateway" },
	{ path = "harmony_luau_sys::vm::lua_rawcheckstack", reason = "can raise; use lua_checkstack" },
	{ path = "harmony_luau_sys::vm::lua_settop", reason = "can raise; use the harmony-luau gateway" },
	{ path = "harmony_luau_sys::vm::lua_pushvalue", reason = "can raise; use the harmony-luau gateway" },
	{ path = "harmony_luau_sys::vm::lua_xmove", reason = "can raise; use the harmony-luau gateway" },
	{ path = "harmony_luau_sys::vm::lua_tolstring", reason = "can raise; use the harmony-luau gateway" },
	{ path = "harmony_luau_sys::vm::lua_tostring", reason = "can raise; use the harmony-luau gateway" },
	{ path = "harmony_luau_sys::vm::lua_pushnil", reason = "can raise; use the harmony-luau gateway" },
	{ path = "harmony_luau_sys::vm::lua_pushnumber", reason = "can raise; use the harmony-luau gateway" },
	{ path = "harmony_luau_sys::vm::lua_pushinteger64", reason = "can raise; use the harmony-luau gateway" },
	{ path = "harmony_luau_sys::vm::lua_pushvector", reason = "can raise; use the harmony-luau gateway" },
	{ path = "harmony_luau_sys::vm::lua_pushlstring", reason = "can raise; use the harmony-luau gateway" },
