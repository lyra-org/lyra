stages:
  - check
  - build
  - publish

variables:
  INTERNAL_REGISTRY: gitlab:5380
  IMAGE: gitlab:5380/$CI_PROJECT_PATH

web-revision:
  image: alpine:3.23
  stage: .pre
  variables:
    GIT_LFS_SKIP_SMUDGE: "1"
  script:
    - apk add --no-cache git
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        LYRA_WEB_GIT_HASH=$(cat web.rev)
      else
        git ls-remote --exit-code https://github.com/lyra-org/lyra-web.git refs/heads/main > web-ref
        LYRA_WEB_GIT_HASH=$(awk '{print $1}' web-ref)
      fi
      printf '%s\n' "$LYRA_WEB_GIT_HASH" | grep -Eq '^[0-9a-f]{40}$'
      [ "${#LYRA_WEB_GIT_HASH}" -eq 40 ]
      git init -q lyra-web
      git -C lyra-web fetch -q --depth 1 --filter=tree:0 https://github.com/lyra-org/lyra-web.git "$LYRA_WEB_GIT_HASH"
      printf 'LYRA_WEB_GIT_HASH=%s\n' "$LYRA_WEB_GIT_HASH" > web.env
  artifacts:
    reports:
      dotenv: web.env
  rules: &docker_rules
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "ci/buildkit"
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"

.buildkit:
  image:
    name: moby/buildkit:v0.34.2-rootless
    entrypoint: [""]
  variables:
    BUILDCACHE: gitlab:5380/$CI_PROJECT_PATH/cache
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox --config=/tmp/buildkitd.toml
  before_script:
    - mkdir -p "$HOME/.docker"
    - |
      AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      cat > "$HOME/.docker/config.json" <<EOF
      {
        "auths": {
          "$INTERNAL_REGISTRY": { "auth": "$AUTH" }
        }
      }
      EOF
      cat > /tmp/buildkitd.toml <<EOF
      [registry."$INTERNAL_REGISTRY"]
        http = true
      EOF

release-checks:
  image: alpine:3.23
  stage: check
  variables:
    GIT_DEPTH: "0"
    GIT_LFS_SKIP_SMUDGE: "1"
  script:
    - apk add --no-cache git jq
    - sh ci/release-checks.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"

clippy:
  extends: .buildkit
  stage: check
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt target=clippy \
        --import-cache "type=registry,ref=$BUILDCACHE:clippy" \
        --export-cache "type=registry,ref=$BUILDCACHE:clippy,mode=max"
  rules:
    - if: $CI_COMMIT_BRANCH == "ci/buildkit"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"

docker:
  extends: .buildkit
  stage: build
  dependencies:
    - web-revision
  script:
    - |
      TAGS=$(sh ci/image-tags.sh)
      NAMES=""
      for TAG in $TAGS; do
        NAMES="$NAMES,$IMAGE:$TAG"
      done
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt "build-arg:LYRA_GIT_HASH=$CI_COMMIT_SHA" \
        --opt "build-arg:LYRA_WEB_GIT_HASH=$LYRA_WEB_GIT_HASH" \
        --output "type=image,\"name=${NAMES#,}\",push=true" \
        --import-cache "type=registry,ref=$BUILDCACHE:clippy" \
        --import-cache "type=registry,ref=$BUILDCACHE:docker" \
        --export-cache "type=registry,ref=$BUILDCACHE:docker,mode=max"
  rules: *docker_rules

image-channels:
  image: alpine:3.23
  stage: publish
  needs:
    - docker
  resource_group: image-channels
  variables:
    GIT_LFS_SKIP_SMUDGE: "1"
  script:
    - apk add --no-cache git skopeo
    - |
      CHANNELS=$(sh ci/image-tags.sh channels)
      if [ -n "$CHANNELS" ]; then
        printf '%s\n' "$CI_REGISTRY_PASSWORD" |
          skopeo login --tls-verify=false -u "$CI_REGISTRY_USER" --password-stdin "$INTERNAL_REGISTRY"
      fi
      for CHANNEL in $CHANNELS; do
        skopeo copy --all --preserve-digests --src-tls-verify=false --dest-tls-verify=false \
          "docker://$IMAGE:sha-$CI_COMMIT_SHA" "docker://$IMAGE:$CHANNEL"
      done
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
