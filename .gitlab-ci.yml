stages:
  - check
  - build

web-revision:
  image: alpine:3.23
  stage: .pre
  script:
    - apk add --no-cache git
    - |
      git ls-remote --exit-code https://github.com/lyra-org/lyra-web.git refs/heads/main > web-ref
      LYRA_WEB_GIT_HASH=$(awk '{print $1}' web-ref)
      printf '%s\n' "$LYRA_WEB_GIT_HASH" | grep -Eq '^[0-9a-f]{40}$'
      printf 'LYRA_WEB_GIT_HASH=%s\n' "$LYRA_WEB_GIT_HASH" > web.env
  artifacts:
    reports:
      dotenv: web.env
  rules: &docker_rules
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"

.kaniko:
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    INTERNAL_REGISTRY: gitlab:5380
    IMAGE: gitlab:5380/$CI_PROJECT_PATH
    BUILDCACHE: gitlab:5380/$CI_PROJECT_PATH/cache
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "$INTERNAL_REGISTRY": { "auth": "$AUTH" }
        }
      }
      EOF

clippy:
  extends: .kaniko
  stage: check
  script:
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --target=clippy \
        --skip-unused-stages=true \
        --no-push \
        --build-arg LYRA_GIT_HASH=$CI_COMMIT_SHA \
        --build-arg "LYRA_RELEASE_TAG=$CI_COMMIT_TAG" \
        --cache=true \
        --cache-repo=$BUILDCACHE \
        --insecure-registry=$INTERNAL_REGISTRY
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"

docker:
  extends: .kaniko
  stage: build
  dependencies:
    - web-revision
  script:
    - |
      DESTS="--destination=$IMAGE:sha-$CI_COMMIT_SHA"
      if [ -n "$CI_COMMIT_TAG" ]; then
        DESTS="$DESTS --destination=$IMAGE:$CI_COMMIT_TAG"
      fi
      if [ -n "$CI_COMMIT_BRANCH" ]; then
        SAFE_BRANCH=$(echo "$CI_COMMIT_BRANCH" | tr '/' '-')
        DESTS="$DESTS --destination=$IMAGE:$SAFE_BRANCH"
      fi
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        DESTS="$DESTS --destination=$IMAGE:latest"
      fi
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        $DESTS \
        --skip-unused-stages=true \
        --build-arg LYRA_GIT_HASH=$CI_COMMIT_SHA \
        --build-arg "LYRA_WEB_GIT_HASH=$LYRA_WEB_GIT_HASH" \
        --build-arg "LYRA_RELEASE_TAG=$CI_COMMIT_TAG" \
        --cache=true \
        --cache-repo=$BUILDCACHE \
        --insecure-registry=$INTERNAL_REGISTRY
  rules: *docker_rules
