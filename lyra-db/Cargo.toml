[package]
name = "lyra-db"
version.workspace = true
edition = "2024"
license-file = "../LICENSE"

[features]
docgen = ["dep:schemars"]
# Enables code paths that require a nightly compiler, such as libtest benchmarks.
nightly = []
# Exposes `test_db` to dependent crates' tests.
testing = []

[dependencies]
agdb = { version = "0.16.2", features = ["serde"] }
anyhow = { workspace = true }
blake3 = { workspace = true }
lofty = "=0.25.4"
lyra-metadata = { path = "../lyra-metadata" }
nanoid = "0.4"
rand = "0.9"
schemars = { version = "1.2.1", features = ["derive"], optional = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
unicode-normalization = "0.1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }

[dev-dependencies]
tempfile = { workspace = true }
