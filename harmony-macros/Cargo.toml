[package]
name = "harmony-macros"
version = "0.0.1-dev"
edition = "2024"
license-file = "../LICENSE"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
harmony-core = { path = "../harmony-core" }
harmony-luau = { path = "../harmony-luau" }
