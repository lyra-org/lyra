run_as = "manager"

# The manager manages libraries and sees the Shown library and its album; Hidden is granted to
# no one.

[[users]]
key = "manager"
permissions = ["manage_libraries"]

[[libraries]]
key = "shown"
name = "Shown"
users = ["manager"]

[[libraries]]
key = "hidden"
name = "Hidden"

[[releases]]
key = "album"
title = "Album"
library = "shown"
