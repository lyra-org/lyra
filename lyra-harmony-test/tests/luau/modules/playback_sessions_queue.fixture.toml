run_as = "listener"

# The listener sees "Album" and its songs One and Two; Hidden is in a library nobody is granted.

[[users]]
key = "listener"

[[libraries]]
key = "music"
name = "Music"
users = ["listener"]

[[libraries]]
key = "locked"
name = "Locked"

[[releases]]
key = "album"
title = "Album"
library = "music"

[[releases]]
key = "secret"
title = "Secret"
library = "locked"

[[tracks]]
key = "one"
title = "One"
release = "album"
duration_ms = 200000

[[tracks]]
key = "two"
title = "Two"
release = "album"
duration_ms = 200000

[[tracks]]
key = "hidden"
title = "Hidden"
release = "secret"
duration_ms = 200000

# A queue another plugin's client saved.
[[playbacks]]
key = "car"
user = "listener"
tracks = ["two"]
position_ms = 1000
client_name = "Car"
plugin = "subsonic"
updated = 1700000001000

# A queue Lyra's web client left paused on a song since hidden, the newest with a song left to
# play.
[[playbacks]]
key = "web"
user = "listener"
tracks = ["one", "hidden", "two"]
current = 1
position_ms = 4000
client_name = "Lyra Web"
updated = 1700000002000

# The newest queue, with nothing left to play.
[[playbacks]]
key = "gone"
user = "listener"
tracks = ["hidden"]
updated = 1700000003000

# A queue this plugin's client saved before its last song was hidden.
[[playbacks]]
key = "tablet"
user = "listener"
tracks = ["one", "hidden"]
client_name = "Tablet"
plugin = "test"
updated = 1700000000000
